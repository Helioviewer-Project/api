;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Helioviewer.org Example Configuration   ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; This file contains basic configuration parameters used to control
; Helioviewer.org's behavior. Before Helioviewer.org can be used, this file
; must be copied or renamed to Config.ini and adjusted to reflect your system
; settings. Many of the parameters are described below. For a more detailed
; description of the entire installation process, see the installation
; documentation located on the Helioviewer Wiki:
;
;   http://wiki.helioviewer.org/wiki/Installing_Helioviewer.org
;
; Questions/Comments?
;   contact@helioviewer.org
;
[version]
last_update = 2025/12/10
build_num   = 822

[application]
app_env     = development

[sentry]
sentry_dsn = http://sentry-dsn
sentry_enabled = false
sentry_sample_rate = 0.1

[filepaths]
; The root directory where of your Helioviewer.org installation. This must be
; somewhere that Apache allows access to.
root_dir     = /var/www-api/docroot

; Directory where cache files will be written.  Must be writable by Apache.
; You may want to set up a cron job to periodically cull old or infrequently
; accessed caches.
cache_dir    = /var/www-api/docroot/cache

; The root directory of your JPEG 2000 archive, if one is available.
jp2_dir      = /var/www-api/docroot/jp2

[urls]
; The URL that corresponds with the root_dir specified above. This is your API root
web_root_url     = http://localhost

; The URL that should be used when making requests in tests
local_test_url   = http://127.0.0.1:80

; The URL that corresponds with the jp2_dir specified above.
jp2_root_url     = http://localhost/jp2

; The root URL to your JPIP server if one is available.
jpip_root_url    = jpip://localhost:8090

; The root URL to the Helioviewer client application
client_url       = http://helioviewer.org

; CORS
;acao_url[] = ''
acam     = 'GET, POST, PUT, PATCH, OPTIONS'

[executables]
; Location of the kdu_merge binary to be used during JPX image generation.
kdu_merge_bin = /usr/local/bin/kdu_merge

; Location of the kdu_merge binary to be used during tile generation.
kdu_expand    = /usr/local/bin/kdu_expand

[jhelioviewer]
; The maximum frames allowed for a JPX image request. Requests which would go
; over this limit are automatically adjusted (sub-sampled) and a JPX file with
; this many or fewer frames is generated instead.
; Note that due to limitations relating to the length allowed for kdu_merge
; command-line arguments, values which are very large may not always work.
; Future versions of Helioviewer may include a work-around to this limitation,
; however, the limit currently allowed should probably be sufficient for most
; cases.
max_jpx_frames = 1000

[events]
; Use MySQL database to store events (true = yes; false = no)
db_events = true
; Auth password to import events. Must be included as an auth url parameter when calling importEvents.
; For example /?action=importEvents&period=1D&auth=1337
; Leave blank for no password, otherwise choose a long and sufficiently random string
import_events_auth = ""

; This is the URL of the eventsapi, you can set to your development one if needed
events_api_url = "https://events.helioviewer.org"

; The User-Agent header of every request this API sends to the events API, so
; the events server's logs tell this API's requests from a browser's.
; Missing or empty = "Helioviewer-API/2.0".
events_api_user_agent = "Helioviewer-API/2.0"

; Timeout in seconds for Events API requests. Must comfortably exceed one
; chunk's time: at ~165ms/timestamp a 150-timestamp chunk is ~25s, and the
; events server's cold/first request can spike higher, so keep generous margin.
; If a chunk exceeds this, curl aborts (28) and EventContext::build swallows it
; into an empty context -> movie renders with no events.
events_api_timeout = 90

; Number of timestamps per Events API batch request when building a movie.
; Larger = fewer round-trips per movie, but each chunk must finish within
; events_api_timeout. Capped by events_api_events_per_frame_max_chunk_size below.
events_api_events_per_frame_chunksize = 150

; Upstream-imposed cap on timestamps per Events API batch request.
; Any chunk size larger than this gets clamped down to this value.
events_api_events_per_frame_max_chunk_size = 150

; Upstream-imposed cap on path-prefix selections per frames_with_selections
; request. Exceeding this raises EventsApiException before any HTTP call.
events_api_events_per_frame_max_selections = 200

; How many frames_with_selections chunk requests run at the same time. The
; events server has about two requests' worth of parallel capacity, so six at
; a time answer a 300-frame movie in about half the time of one after another
; and twelve gain nothing more. The timestamps are spread over this many
; chunks, never above the chunk size above, never above 25 and never below 10
; per chunk. 1 = one request after another. Missing = 1.
events_api_events_per_frame_concurrency = 6

; How many events requests all the workers of this box may have in flight at
; once, a cap held in Redis. The events server answers at its own pace and the
; proxy in front of it cuts a request off after 60 s: with 60 pieces asking at
; once (two 300-frame movies) a quarter of the requests were cut off, each
; retried for another 60 s, and a piece can end up drawing its frames without
; events. With the cap a piece waits on this side, with no clock running,
; until a slot is free; a movie takes the same time either way, since the
; server's pace is the limit. Measured (2026-11-06, requests of 10
; timestamps): the server's throughput is reached at 12 to 16 in flight;
; above that the replies only get slower, 54 s at 60 in flight, near the
; cut. 0 or missing = no cap.
events_api_max_in_flight = 16

[movie_params]
; FFmpeg location
ffmpeg = ffmpeg

; x264 presets of the two H.264 encodes of a movie, both from the frames in
; one ffmpeg pass: x264_hq_preset for the high-quality mp4 (crf 15),
; x264_preset for the normal mp4 (crf 18, the longer of the two). The normal
; mp4 was converted from the high-quality one before; from the frames,
; "veryfast" gives the quality that "fast" gave then, in about half the time.
x264_preset = "veryfast"
x264_hq_preset = "ultrafast"

; The maximum number of frames of a movie.
max_movie_frames = 300
; The maximum number of rows from the database that can be processed to create a movie.
; This is to preserve memory usage, since each row represents a frame, and this
; will be reduced to the above number of frames. As long as this is greater than
; max_movie_frames, this should have no material impact on generating movies.
max_row_limit = 15000

; Maximum number of threads each libx264 encode may use (the pass runs two).
; '0' lets it use every CPU of the machine; keep it modest where many movies
; encode at once.
ffmpeg_max_threads = 8

; Movie generation queue: a movie request queues one Job_MovieBuilder here.
movie_queue = "api_movie"

; A movie long enough is built as pieces, each a Job_MoviePiece on this queue
; building a range of its frames on a worker of its own; the last piece to
; end queues the end of the movie (encode, statuses). The workers read this
; queue before movie_queue (scripts/movie_queue.tcsh), so a movie in
; progress is finished before a new one is started.
movie_piece_queue = "api_movie_piece"
; A piece has at least this many frames (a piece costs a few seconds to
; start, so a short movie is not cut) and a movie has at most this many
; pieces (so one movie cannot take every worker). A 300-frame movie is 8
; pieces of 37 or 38 frames with these, a 30-frame movie 3 pieces of 10.
movie_piece_min_frames = 10
movie_pieces_max = 8

[database]
; Table names for the movies, screenshots, and client_states tables. Override
; these if those tables live under different names in your database (e.g. a
; shared database, or a per-instance naming scheme). Defaults shown; leaving
; them unset keeps the canonical names, so no change is required for a normal
; install. Every query in the API resolves the table through these values.
db_table_movies        = "movies"
db_table_screenshots   = "screenshots"
db_table_client_states = "client_states"

[statistics]
; Whether basic usage statistics should be collected by Helioviewer.org.
; Currently the information collected is very basic and does not include
; information about the specifics of the query, but rather the type of
; query and when the query was made.
enable_statistics_collection = true

[extra]
; An optional Google Analytics Web Property ID. If set, the Google Analytics
; code will be included on the main page using the specified ID.
; See https://www.google.com/analytics for more information.
google_analytics_id = ""

[boundaries]
; The date representing the oldest data that is available on helioviewer.
; This is used to ignore any requests for times that come in below this date.
; Helioviewer may also use this as a way to check that a given date is valid.
minimum_date = '1990-01-01'

[news]
; RSS/Atom News feed to display headlines from
news_feed_url = https://helioviewer-project.github.io/feed.xml

[contact]
; Contact email address
contact_email = HelioViewerDevelopment@nasa.onmicrosoft.com

; Image that appears at the top of the API documentation
api_logo = resources/images/about.png

[debug]
; Disables caching of image tiles
disable_cache = false

[status]
; Directory where the backfill logs are stored to be displayed on the status page
; These should be updated on a running server to a less temporary space if not
; just for testing.
SDO_weekly_log = /tmp/sdo-backfill.log
SDO_monthly_log = /tmp/sdo-monthly.log
SWAP_weekly_log = /tmp/rob-backfill.log
SWAP_monthly_log = /tmp/rob-monthly.log
SOHO_weekly_log = /tmp/soho-backfill.log
SOHO_monthly_log = /tmp/soho-monthly.log
STEREO_weekly_log = /tmp/stereo-backfill.log
STEREO_monthly_log = /tmp/stereo-monthly.log

[rate-limit]
; Whether or not rate limiting should be enabled and enforced
; Whether or not rate limiting should be enabled and enforced
enforce_rate_limit = false
; Maximum number of requests (per minute) that a client can make before being rate limited
rate_limit_maximum_requests = 3000
; Prefix for the key stored in redis db. All keys will be structured as "identifier/interval"
rate_limit_prefix = "limit"
; Prefix for rate limit exceeded logging keys
; Contains date so the key cannot contain : because of h:m:s iso date format
rate_exceeded_prefix = "exceeded"

[redis-stats]
redis_stats_prefix = "stat"

[proxy]
http_proxy = ''
https_proxy = ''
http_export = ''

[coordinator]
# URL to the Coordinator API.
# This is a supporting http api running python which
# takes advantage of sunpy for more robust coordinator
# processing. See https://github.com/dgarciabriseno/coordinator
# for more details
# If running the coordinator locally, then change this to
# http://localhost:port
coordinator_url = 'http://coordinator'

[superset]
superset_url = 'http://localhost:8088'
superset_sidecar_url = 'http://localhost:8087'
superset_coverage_dashboard_id = 'your-dashboard-id-here'
superset_movie_stats_dashboard_id = 'your-dashboard-id-here'
superset_jhelioviewer_stats_dashboard_id = 'your-dashboard-id-here'
superset_statistics_dashboard_id = 'your-dashboard-id-here'
